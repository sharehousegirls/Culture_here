
name: Test National Performance API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test API connection
        env:
          API_KEY: ${{ secrets.NATIONAL_PERFORMANCE_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API secret is missing."
            exit 1
          fi

          URL="https://api.data.go.kr/openapi/tn_pubr_public_pblprfr_event_info_api"

          curl -sS -G "$URL" \
            --data-urlencode "serviceKey=$API_KEY" \
            --data-urlencode "pageNo=1" \
            --data-urlencode "numOfRows=1" \
            --data-urlencode "type=json" \
            -o response.json \
            -w "HTTP_STATUS:%{http_code}\n"

          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("response.json", "utf8"));
            console.log(JSON.stringify(data, null, 2));
          '
