name: Collect Culture Portal API Data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check API key
        id: keycheck
        env:
          CULTURE_PORTAL_API_KEY: ${{ secrets.CULTURE_PORTAL_API_KEY }}
        run: |
          if [ -z "$CULTURE_PORTAL_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CULTURE_PORTAL_API_KEY secret is not configured. Collection skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect data
        if: steps.keycheck.outputs.configured == 'true'
        env:
          CULTURE_PORTAL_API_KEY: ${{ secrets.CULTURE_PORTAL_API_KEY }}
        run: node scripts/collect-culture-portal.js
      - name: Commit dataset
        if: steps.keycheck.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programs.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged."
          else
            git commit -m "Update Culture Portal API dataset"
            git push
          fi
