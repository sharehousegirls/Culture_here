name: Culture Here CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check app.js
          node --check scripts/collect-culture-portal.js
      - name: Required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f api.js
          test -f scripts/collect-culture-portal.js
          test -f README.md
